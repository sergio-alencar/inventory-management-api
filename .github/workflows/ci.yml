name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./InventoryManagementApi

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --no-restore --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Development

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-management-ui

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "inventory-management-ui/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2R tests
        run: npm run test:e2e:render
        env:
          VITE_API_URL: https://inventory-management-api-48yw.onrender.com/api

      - name: Upload of Test reports HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: inventory-management-ui/playwright-report/
          retention-days: 30
